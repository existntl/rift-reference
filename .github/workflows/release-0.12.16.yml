name: Publish Rift Ready 0.12.16

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-0.12.16.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_BASE: https://b2170ca2b90649.lhr.life
      EXPECTED_SHA256: c3a772bf33a89e291ea1becec0b9979a6a3404375140e1d9e4e3ffe2eb8fffb0
      EXPECTED_SIZE: "23662080"
      TARGET_COMMIT: ded9a499667abed20c6af62db483a30432fb5c3d
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify signed release assets
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 6 --retry-all-errors --connect-timeout 30 --max-time 900 "$RELEASE_BASE/RiftReference-Setup.exe" --output RiftReference-Setup.exe
          curl --fail --location --retry 6 --retry-all-errors --connect-timeout 30 --max-time 120 "$RELEASE_BASE/latest.json" --output latest.json
          printf '%s  %s\n' "$EXPECTED_SHA256" RiftReference-Setup.exe | sha256sum --check -
          test "$(stat -c %s RiftReference-Setup.exe)" = "$EXPECTED_SIZE"
          python - <<'PY'
          import base64, json, os
          with open("latest.json", "r", encoding="utf-8") as f:
              envelope=json.load(f)
          payload=json.loads(base64.b64decode(envelope["payload"]).decode("utf-8"))
          assert envelope.get("signature")
          assert payload["version"]=="0.12.16"
          assert payload["sha256"]==os.environ["EXPECTED_SHA256"]
          assert str(payload["sizeBytes"])==os.environ["EXPECTED_SIZE"]
          assert payload["installerUrl"]=="https://github.com/existntl/rift-reference/releases/download/v0.12.16/RiftReference-Setup.exe"
          PY
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Rift Ready 0.12.16 refines the desktop window chrome and Preferences experience.

          - Adds a slim Rift Ready title strip with compact Windows-ordered window controls.
          - Opens Preferences as a fixed, close-only modal over a dimmed app background.
          - Makes the optional one-second timing click slightly louder at the same master volume.

          The one-second click remains off by default. Existing preferences, overlay layout, rank history, review notes and recovery copies are preserved during upgrades.
          EOF
          gh release create v0.12.16 --target "$TARGET_COMMIT" --title "Rift Ready 0.12.16" --notes-file release-notes.md --latest "RiftReference-Setup.exe#Rift Ready 0.12.16 installer" "latest.json#Signed updater manifest"
      - name: Remove temporary workflow
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/release-0.12.16.yml
          git commit -m "Remove temporary 0.12.16 release workflow"
          git push origin HEAD:main
