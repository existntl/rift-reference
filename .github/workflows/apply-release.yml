name: Apply Rift Ready 0.12.15 source

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repository with tested release source
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/rift-ready-0.12.15"
          mkdir -p "$payload"
          unzip -q release-source.zip -d "$payload"
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name release-source.zip -exec rm -rf {} +
          cp -a "$payload"/. .
          rm -f release-source.zip
          rm -f .github/workflows/apply-release.yml
          rmdir .github/workflows .github 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Release Rift Ready 0.12.15"
          git push origin HEAD:main
